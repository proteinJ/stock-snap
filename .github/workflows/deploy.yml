name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'metrics/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/reusable-test.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'metrics/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/reusable-test.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy DORA metrics for Pages
        run: |
          if [ -f metrics/dora.json ]; then
            cp metrics/dora.json site/dora.json
          fi

      - name: Check built site
        run: |
          test -f site/index.html
          test -f site/dora.html
          test -f site/dora.json
          python3 -c "import json; json.load(open('site/dora.json', encoding='utf-8'))"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7

  test:
    needs: build
    uses: ./.github/workflows/reusable-test.yml

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
