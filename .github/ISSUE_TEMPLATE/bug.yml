name: Bug
description: 버그를 제보합니다.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - collector
        - analysis
        - site
        - dora
        - workflow
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - p1
        - p2
        - p3
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 현상
      description: 어떤 문제가 발생했는지 명확히 작성해 주세요.
      placeholder: 예) 특정 종목 조회 시 500 오류가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      description: 문제를 재현할 수 있는 순서를 단계별로 작성해 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 기대했던 동작을 작성해 주세요.
    validations:
      required: true

  - type: checkboxes
    id: incident
    attributes:
      label: 운영 영향
      description: 체크했다면 이슈 생성 후 `incident` 라벨을 추가해 주세요.
      options:
        - label: 운영 장애인가요?

  - type: checkboxes
    id: regression
    attributes:
      label: 회귀 여부
      description: 체크했다면 이슈 생성 후 `kind:regression` 라벨을 추가해 주세요.
      options:
        - label: 이전에는 동작했나요?
